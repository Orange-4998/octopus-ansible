---
- name: Octopus Linux - Main Setup
  hosts: localhost
  connection: local

  vars:
    ansible_bot_user: ansible-bot
    box_data_dir: /var/data/box-data
    bot_home_dir: "/var/home/{{ ansible_bot_user }}"

  tasks:
    ## 1. Shared Storage & Home Setup ##
    - name: Ensure box-data and distrobox home root directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_bot_user }}"
        group: "{{ ansible_bot_user }}"
        mode: '0775'
      loop:
        - "{{ box_data_dir }}"
        - "{{ bot_home_dir }}/main-home"
        - "{{ bot_home_dir }}/gaming-home"
        - "{{ bot_home_dir }}/vivado-home"

    ## 2. Distrobox Verification & Parsing ##
    - name: Get list of existing Distroboxes
      ansible.builtin.command: distrobox list --no-color
      register: distrobox_list_raw
      changed_when: false

    - name: Parse Distrobox names
      ansible.builtin.set_fact:
        existing_boxes: "{{ distrobox_list_raw.stdout_lines | map('regex_replace', '^(\\S+)\\s+.*$', '\\1') | list }}"

    ## 3. Create Distroboxes with Dedicated Homes ##
    - name: Create 'main' Distrobox (Fedora / General Work)
      ansible.builtin.command: >
        distrobox create --name main
        --image registry.fedoraproject.org/fedora-toolbox:latest
        --home {{ bot_home_dir }}/main-home
        --volume {{ box_data_dir }}:/box-data
        -Y
      when: "'main' not in existing_boxes"

    - name: Create 'gaming' Distrobox (Debian / Gaming)
      ansible.builtin.command: >
        distrobox create --name gaming
        --image debian:latest
        --home {{ bot_home_dir }}/gaming-home
        --volume {{ box_data_dir }}:/box-data
        -Y
      when: "'gaming' not in existing_boxes"

    - name: Create 'ece385-vivado' Distrobox (Ubuntu 22.04 / Vivado 2022.2)
      ansible.builtin.command: >
        distrobox create --name ece385-vivado
        --image ubuntu:22.04
        --home {{ bot_home_dir }}/vivado-home
        --volume {{ box_data_dir }}:/box-data
        -Y
      when: "'ece385-vivado' not in existing_boxes"

    ## 4. Gaming Container Dependencies ##
    - name: Enable 32-bit architecture in gaming box
      ansible.builtin.command: distrobox enter gaming -- sudo dpkg --add-architecture i386
      changed_when: false

    - name: Install Wine and dependencies in gaming box
      ansible.builtin.command: >
        distrobox enter gaming -- sudo apt-get update &&
        sudo apt-get install -y wine wine32 wine64 libwine libwine:i386 fonts-wine curl tar

    - name: Download GE-Proton into gaming box
      ansible.builtin.shell: |
        distrobox enter gaming -- bash -c '
          mkdir -p ~/.steam/root/compatibilitytools.d/
          LATEST_URL=$(curl -s https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest | grep "browser_download_url.*tar.gz" | cut -d : -f 2,3 | tr -d \")
          curl -sL $LATEST_URL | tar -xz -C ~/.steam/root/compatibilitytools.d/
        '
      args:
        creates: "{{ bot_home_dir }}/gaming-home/.steam/root/compatibilitytools.d/GE-Proton*"

    ## 5. Import Auto-Wine & Vivado Setup Tasks ##
    - name: Run automated Wine installer and prefix configuration
      ansible.builtin.import_tasks: wine_setup.yml
