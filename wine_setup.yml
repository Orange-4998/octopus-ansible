---
# wine_setup.yml
- name: Define target Wine applications
  set_fact:
    apps:
      - name: "ZenlessZoneZero"
        installer: "HoYoPlay_Setup.exe"
        installer_args: "/S"
        installed_exe: "drive_c/Program Files/HoYoPlay/HoYoPlay.exe"

- name: Ensure Wine directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /home/box-data/winstallers
    - /home/box-data/wine-prefixes

- name: Initialize Wine prefixes inside gaming box
  command: >
    distrobox enter gaming --
    env WINEPREFIX="/home/box-data/wine-prefixes/{{ item.name }}"
    wineboot -u
  args:
    creates: "/home/box-data/wine-prefixes/{{ item.name }}/user.reg"
  loop: "{{ apps }}"

- name: Run Windows installers inside gaming box using GE-Proton
  shell: >
    distrobox enter gaming -- bash -c '
      export WINEPREFIX="/home/box-data/wine-prefixes/{{ item.name }}";
      
      # Dynamically pick the installed GE-Proton binary
      RUNNER="$(ls -1d ~/.steam/root/compatibilitytools.d/GE-Proton* | tail -n 1)/files/bin/wine"
      
      # Execute installer
      "$RUNNER" "/home/box-data/winstallers/{{ item.installer }}" {{ item.installer_args | default("") }}
    '
  args:
    creates: "/home/box-data/wine-prefixes/{{ item.name }}/{{ item.installed_exe }}"
  loop: "{{ apps }}"
