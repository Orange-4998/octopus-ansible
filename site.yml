---
- name: Octopus Linux - Main Setup
  hosts: localhost
  connection: local

  vars:
    human_user: human
    box_data_dir: /home/box-data

  tasks:
    ## 1. Directory Setup (Requires Sudo) ##
    - name: Ensure shared box-data directory exists with correct group permissions
      become: yes
      file:
        path: "{{ box_data_dir }}"
        state: directory
        owner: "{{ human_user }}"
        group: octopus-home
        mode: '2775'

    ## 2. Distrobox Creation (Runs as ansible-bot) ##
    - name: Get list of existing Distroboxes
      command: distrobox list --no-color
      register: distrobox_list_raw
      changed_when: false

    - name: Parse Distrobox names
      set_fact:
        existing_boxes: "{{ distrobox_list_raw.stdout_lines | map('regex_replace', '^(\\S+)\\s+.*$', '\\1') | list }}"

    - name: Create 'main' Distrobox (Fedora / Firefox)
      command: >
        distrobox create --name main
        --image registry.fedoraproject.org/fedora-toolbox:latest
        --home /home/human
        --volume {{ box_data_dir }}:/box-data
        -Y
      when: "'main' not in existing_boxes"

    - name: Create 'gaming' Distrobox (Debian / ZZZ)
      command: >
        distrobox create --name gaming
        --image debian:latest
        --home {{ box_data_dir }}
        -Y
      when: "'gaming' not in existing_boxes"

    ## 3. Gaming Dependencies (Runs as ansible-bot) ##
    - name: Enable 32-bit architecture in gaming box
      command: distrobox enter gaming -- sudo dpkg --add-architecture i386
      changed_when: false

    - name: Install Wine and graphical libraries in gaming box
      command: >
        distrobox enter gaming -- sudo apt-get update &&
        sudo apt-get install -y wine wine32 wine64 libwine libwine:i386 fonts-wine curl tar

    - name: Download GE-Proton into gaming box
      shell: |
        distrobox enter gaming -- bash -c '
          mkdir -p ~/.steam/root/compatibilitytools.d/
          LATEST_URL=$(curl -s https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest | grep "browser_download_url.*tar.gz" | cut -d : -f 2,3 | tr -d \")
          curl -sL $LATEST_URL | tar -xz -C ~/.steam/root/compatibilitytools.d/
        '
      args:
        creates: "/home/box-data/.steam/root/compatibilitytools.d/GE-Proton*"

    ## 4. Import Auto-Wine Setup Logic ##
    - name: Run automated Wine installer and prefix configuration
      ansible.builtin.import_tasks: wine_setup.yml
